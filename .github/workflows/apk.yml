name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: node test/sim.mjs | tee sim.txt && ! grep -q "NO BLOQUEO" sim.txt
      - run: npx vite build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Auditoria de permisos
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions $APK | tee perms.txt
          if grep -Eq "INTERNET|STORAGE|CAMERA|CONTACTS|RECORD_AUDIO|SMS|PHONE" perms.txt; then echo "PERMISO NO PERMITIDO"; exit 1; fi
          cp $APK S10Diag.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: S10Diag build ${{ github.run_number }}
          files: S10Diag.apk
